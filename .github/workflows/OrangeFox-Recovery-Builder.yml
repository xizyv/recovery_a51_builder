name: OrangeFox A51 Recovery Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FOX_BRANCH: "12.1"
  DEVICE_TREE: "https://github.com/xizyv/recovery_a51.git"
  DEVICE_TREE_BRANCH: "fox_12.1"
  DEVICE_PATH: "device/samsung/a51"
  DEVICE_NAME: "a51"

jobs:
  build:
    name: Build OrangeFox 12.1 for Galaxy A51
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Display Build Configuration
        run: |
          echo "OrangeFox branch: $FOX_BRANCH"
          echo "Device: $DEVICE_NAME"
          echo "Device tree: $DEVICE_TREE"
          echo "Device tree branch: $DEVICE_TREE_BRANCH"
          echo "Device path: $DEVICE_PATH"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt -y upgrade

          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Initialize OrangeFox Manifest
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox"
          cd "$GITHUB_WORKSPACE/OrangeFox"

          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@example.invalid"

          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync

          ./orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

      - name: Add A51 Device Tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

          mkdir -p .repo/local_manifests

          TREE_URL="${DEVICE_TREE%.git}"
          TREE_BASE="${TREE_URL%/*}"
          TREE_NAME="${TREE_URL##*/}"

          cat > .repo/local_manifests/a51.xml <<EOF
          <manifest>
            <remote name="a51-tree" fetch="$TREE_BASE" />
            <project
              name="$TREE_NAME"
              path="$DEVICE_PATH"
              remote="a51-tree"
              revision="$DEVICE_TREE_BRANCH" />
          </manifest>
          EOF

          repo sync -c --force-sync --no-clone-bundle --no-tags \
            "$DEVICE_PATH"

          cd "$DEVICE_PATH"

          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify Device Configuration
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

          test -f "$DEVICE_PATH/AndroidProducts.mk"
          test -f "$DEVICE_PATH/twrp_a51.mk"
          test -f "$DEVICE_PATH/BoardConfig.mk"
          test -f "$DEVICE_PATH/device.mk"
          test -f "$DEVICE_PATH/vendorsetup.sh"

          test -f "$DEVICE_PATH/prebuilts/zImage"
          test -f "$DEVICE_PATH/prebuilts/dtbo.img"

          echo "Device tree files found."

          grep -q 'twrp_a51.mk' "$DEVICE_PATH/AndroidProducts.mk"
          grep -q 'PRODUCT_NAME := twrp_a51' "$DEVICE_PATH/twrp_a51.mk"

          echo "Product configuration verified."

      - name: Build OrangeFox Recovery
        run: |
          cd "$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH"

          echo "=== CHECKING ANDROID MAKEFILE ==="
          ls -l frameworks/base/services/core/xsd/vts/Android.mk || true

          echo "=== LOADING BUILD ENVIRONMENT ==="

          set +e
          source build/envsetup.sh
          ENVSETUP_STATUS=$?
          set -e

          echo "=== ENVSETUP STATUS: $ENVSETUP_STATUS ==="

          if ! command -v lunch >/dev/null 2>&1; then
            echo "ERROR: lunch command is unavailable"
            exit 1
          fi

          if ! command -v mka >/dev/null 2>&1; then
            echo "ERROR: mka command is unavailable"
            exit 1
          fi

          if [ "$ENVSETUP_STATUS" -ne 0 ]; then
            echo "WARNING: envsetup returned $ENVSETUP_STATUS, but lunch and mka are available."
          fi

          echo "=== CONFIGURING A51 ==="
          lunch twrp_a51-eng

          echo "=== BUILDING RECOVERY ==="
          mka adbd recoveryimage

      - name: Check Recovery Image
        run: |
          set -e

          PRODUCT_OUT="$GITHUB_WORKSPACE/OrangeFox/fox_$FOX_BRANCH/out/target/product/$DEVICE_NAME"

          if [ ! -d "$PRODUCT_OUT" ]; then
            echo "ERROR: Product output directory not found."
            exit 1
          fi

          mapfile -t IMAGES < <(
            find "$PRODUCT_OUT" \
              -maxdepth 1 \
              -type f \
              -name 'OrangeFox*.img' \
              | sort
          )

          if [ "${#IMAGES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one OrangeFox image."
            printf '%s\n' "${IMAGES[@]}"
            exit 1
          fi

          cp "${IMAGES[0]}" "$PRODUCT_OUT/recovery.img"

          echo "PRODUCT_OUT=$PRODUCT_OUT" >> "$GITHUB_ENV"
          echo "Recovery image successfully created."

          md5sum "$PRODUCT_OUT/recovery.img"

      - name: Create Samsung Recovery TAR
        run: |
          set -e

          cd "$PRODUCT_OUT"

          tar -cf recovery.tar recovery.img

          echo "Samsung TAR archive created."
          ls -lh recovery.img recovery.tar

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PRODUCT_OUT }}/recovery.img
            ${{ env.PRODUCT_OUT }}/recovery.tar

          name: OrangeFox 12.1 - Galaxy A51 - ${{ env.BUILD_DATE }}
          tag_name: ofrp-a51-${{ github.run_id }}

          body: |
            Unofficial OrangeFox Recovery 12.1

            Device: Samsung Galaxy A51 (SM-A515F)
            Codename: a51

            Device tree:
            https://github.com/xizyv/recovery_a51/tree/fox_12.1

            Device tree commit:
            ${{ env.DEVICE_TREE_COMMIT }}

            Manifest branch: 12.1
