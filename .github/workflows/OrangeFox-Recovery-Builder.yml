name: OrangeFox - Build
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - 14.1
          - 12.1
          - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: 'https://github.com/xizyv/recovery_a51.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'Specify your device path'
        required: true
        default: 'device/samsung/a51'
      DEVICE_NAME:
        description: 'Specify your Device Codename'
        required: true
        default: 'a51'
      CURR_DEVICE:
        description: 'Current Device Codename for vendorsetup'
        required: true
        default: 'a51'
      BUILD_TARGET:
        description: 'Specify your Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      LDCHECK:
        description: 'Path of blobs to check'
        required: false
        default: ''
      RECOVERY_TAR:
        description: 'Release recovery.tar For Samsung devices'
        required: false
        default: true
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer zip'
        type: boolean
        required: true
        default: true
jobs:
  build:
    name: Build OFRP by ${{ github.actor }}
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Display Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
          echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
          echo "::endgroup::"
      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main
      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24
      - name: Build Environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh
      - name: Set-up Manifest
        if: github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' || github.event.inputs.MANIFEST_BRANCH == '14.1'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@example.invalid"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh \
            --branch "${{ github.event.inputs.MANIFEST_BRANCH }}" \
            --path "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
      - name: Add Device Tree to local manifest
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          mkdir -p .repo/local_manifests
          TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          TREE_URL="${TREE_URL%.git}"
          TREE_BASE="${TREE_URL%/*}"
          TREE_NAME="${TREE_URL##*/}"
          cat > .repo/local_manifests/a51.xml <<EOF
          <manifest>
            <remote name="a51-tree" fetch="${TREE_BASE}" />
            <project
              name="${TREE_NAME}"
              path="${{ github.event.inputs.DEVICE_PATH }}"
              remote="a51-tree"
              revision="${{ github.event.inputs.DEVICE_TREE_BRANCH }}" />
          </manifest>
          EOF
          repo sync -c --force-sync --no-clone-bundle --no-tags \
            "${{ github.event.inputs.DEVICE_PATH }}"
          cd "${{ github.event.inputs.DEVICE_PATH }}"
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Set device 64-bit app support
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          BOARD_CONFIG="${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
          if grep -q '^TARGET_SUPPORTS_64_BIT_APPS[[:space:]]*:=' "$BOARD_CONFIG"; then
            sed -i 's/^TARGET_SUPPORTS_64_BIT_APPS[[:space:]]*:=.*/TARGET_SUPPORTS_64_BIT_APPS := true/' "$BOARD_CONFIG"
          else
            echo 'TARGET_SUPPORTS_64_BIT_APPS := true' >> "$BOARD_CONFIG"
          fi
          VENDOR_SETUP="${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh"
          sed -i '/FOX_VERSION=/d' "$VENDOR_SETUP"
          sed -i 's/export OF_VANILLA_BUILD=1/export FOX_VANILLA_BUILD=1/' "$VENDOR_SETUP"
          sed -i 's/export OF_TARGET_DEVICES=/export FOX_TARGET_DEVICES=/' "$VENDOR_SETUP"
          grep -q 'FOX_MAINTAINER_PATCH_VERSION=' "$VENDOR_SETUP" || \
            echo 'export FOX_MAINTAINER_PATCH_VERSION="3"' >> "$VENDOR_SETUP"
          echo "Device configuration patched successfully."
      - name: Check Manifest Branch
        uses: haya14busa/action-cond@v1
        id: fox_branch
        with:
          cond: ${{ github.event.inputs.MANIFEST_BRANCH == '11.0' || github.event.inputs.MANIFEST_BRANCH == '12.1' }}
          if_true: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image
          if_false: lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng && make clean && mka ${{ github.event.inputs.BUILD_TARGET }}image
      - name: Building OrangeFox
        run: |
          export CURR_DEVICE="${{ inputs.CURR_DEVICE }}"
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          set +e
          source build/envsetup.sh
          ENVSETUP_STATUS=$?
          set -e
          echo "envsetup exit code: $ENVSETUP_STATUS"
          if ! declare -F lunch > /dev/null; then
            echo "ERROR: lunch function was not loaded."
            exit 1
          fi
          export ALLOW_MISSING_DEPENDENCIES=true
          ${{ steps.fox_branch.outputs.value }}
      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"
          DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> "$GITHUB_ENV"
      - name: Check if Recovery Exist
        run: |
          cd "${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
          if compgen -G "out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img" > /dev/null; then
            echo "CHECK_IMG_IS_OK=true" >> "$GITHUB_ENV"
            echo "FILE_PATH=${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
            echo "MD5_IMG=$(md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          else
            echo "Recovery image not found."
            exit 1
          fi
      - name: Rename the Recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        run: |
          cd "${{ env.FILE_PATH }}"
          case "${{ github.event.inputs.BUILD_TARGET }}" in
            boot)
              mv OrangeFox*.img boot.img
              echo "RECOVERY_TYPE=boot" >> "$GITHUB_ENV"
              ;;
            recovery)
              mv OrangeFox*.img recovery.img
              echo "RECOVERY_TYPE=recovery" >> "$GITHUB_ENV"
              ;;
            vendorboot)
              mv OrangeFox*.img vendor_boot.img
              echo "RECOVERY_TYPE=vendor_boot" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Include Recovery Installer
        if: github.event.inputs.RECOVERY_INSTALLER == 'true' && env.CHECK_IMG_IS_OK == 'true'
        run: |
          cd "${{ env.FILE_PATH }}"
          wget https://github.com/kinguser981/recovery-installer/releases/download/11256427880/recovery-installer.zip
          zip -ur recovery-installer.zip "${{ env.RECOVERY_TYPE }}.img"
      - name: Recovery to tar for Samsung devices
        if: github.event.inputs.RECOVERY_TAR == 'true' && env.CHECK_IMG_IS_OK == 'true'
        run: |
          cd "${{ env.FILE_PATH }}"
          tar -cvf "${{ env.RECOVERY_TYPE }}.tar" "${{ env.RECOVERY_TYPE }}.img"
      - name: Upload to Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.tar
            ${{ env.FILE_PATH }}/recovery-installer.zip
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            Commit: [Tree commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
      - name: Release ramdisk-recovery
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@4634c16e79c963813287e889244c50009e7f0981
        with:
          files: |
            ${{ env.FILE_PATH }}/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.*
            ${{ env.FILE_PATH }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Target: ${{ env.RECOVERY_TYPE }}.img
            Build: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Device: [Device Tree/Branch](${{ env.DEVICE_TREE_URL }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
            Commit: [Tree commit](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
            MD5 (img): ${{ env.MD5_IMG }}
      - name: Run LDCheck
        if: env.CHECK_IMG_IS_OK == 'true'
        continue-on-error: true
        run: |
          cd tools
          mv -n libneeds "${{ env.FILE_PATH }}/recovery/root/"
          mv -n ldcheck "${{ env.FILE_PATH }}/recovery/root/"
          cd "${{ env.FILE_PATH }}/recovery/root/"
          python3 ldcheck \
            -p system/lib64:vendor/lib64:system/lib:vendor/lib \
            -d "${{ github.event.inputs.LDCHECK }}"
          echo "Done checking missing dependencies."
